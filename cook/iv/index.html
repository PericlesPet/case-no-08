<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121a15">
<title>Case No. 08 · IV · The Alpine Lodge</title>
<meta name="description" content="Team IV cook-mode: snow-capped cream cups for 12.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#121a15; --surface:#1a241e; --surface-2:#24322a; --surface-3:#2d3d33;
  --ink:#f3e7cf; --muted:#b9ab8e; --line:#34463b;
  --accent:#e0a868; --accent-2:#c9a15a; --accent-ink:#121a15; --accent-soft:#3b3424;
  --copper:#d8955f; --wax:#7a2a22; --wax-lt:#a8443a;
  --green:#9fcf86; --green-soft:#22382a; --flame:#e4571c; --flame-in:#ffc23d; --honey:#f2b33a; --eye:#20130b;
  --skin:#a8563d; --skin-dk:#7a3624; --skin-ln:#4a1e12;
  --flesh:#f08a2e; --flesh-dk:#c9621a; --flesh-lt:#f8b26c;
  --syrup:#4a230c; --syrup-lt:#8a4418;
  --ev3:#a9542b; --ev3-lt:#cf7a45; --ev4:#5b3726; --ev4-lt:#8a5a42;
  --mitt:#5a8cad; --mitt-ln:#3c6680; --towel:#d9d1c0; --towel-ln:#9c917c;
  --butter:#f3d56e; --butter-ln:#c9a83e; --cream:#f2eadb; --cream-ln:#9c8c74; --milk:#ffffff;
  --whip:#f4efe6; --whip-ln:#9c8f80; --tint:#c79a7c; --meringue:#efe6d6; --mer-ln:#9c8c74; --cocoa:#4a2c1e; --whey:#d9d3b8;
  --glass:#3f6470; --glass-ln:#8fc3d4; --water:#4e8aa6; --ice:#8fcbf0; --ice-soft:#1e3440;
  --pan:#4a443e; --pan-rim:#6c645c; --steel:#9a948a; --steel-dk:#6e685f;
  --hand:#d8a987; --hand-ln:#a5724d; --plate:#e8e1d6; --screen:#0c120e; --lcd:#ffc46b;
  --bag:#cfd8d2; --bag-ln:#8fa39a; --paper:#efe4c8; --tub:#e8e2d6; --tub-ln:#9c917c;
  --fridge:#2e393e;
  --display:"IM Fell English",Georgia,"Times New Roman",serif;
  --display-sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  --body:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden;
  background-image:radial-gradient(ellipse 90% 60% at 50% 30%,rgba(216,149,95,.07),transparent 70%)}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-inline:16px;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;flex-direction:column;gap:8px;padding-block:12px 4px}
.bars{display:flex;gap:4px}
.bars button{flex:1;height:7px;border:0;border-radius:3px;background:var(--line);padding:0;cursor:pointer}
.bars button.done{background:var(--accent-2)}
.bars button.cur{background:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 15px var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.meta .team{font-family:var(--display-sc);text-transform:none;letter-spacing:.04em;color:var(--accent);font-size:16px}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:16px;padding-block:8px 18px;-webkit-overflow-scrolling:touch}
.stage>*{flex-shrink:0}
.gearh{margin:6px 0 0;font:700 14px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}
.tag{align-self:flex-start;font:700 14px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:1px solid rgba(224,168,104,.35)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,44px);line-height:1.04;margin:0;text-wrap:balance}
.detail{font-size:20px;margin:0;line-height:1.42}
.detail b{color:var(--accent);font-weight:700}
.note{font-size:17px;margin:0;color:var(--muted)}
.art{width:100%;max-width:380px;align-self:center;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.art svg{width:100%;height:auto;display:block}
.ings{display:grid;grid-template-columns:auto 1fr;border-top:1.5px solid var(--line)}
.ings div{padding:10px 0;border-bottom:1.5px solid var(--line)}
.ings .q{font-weight:700;font-variant-numeric:tabular-nums lining-nums;padding-right:16px;white-space:nowrap;color:var(--accent)}
.ings .n small,.check .n small,.gear small{display:block;color:var(--muted);font-size:16px;line-height:1.3}
.timer{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:12px 16px;font:inherit;cursor:pointer;text-align:left;width:100%}
.timer .clock{font:600 36px var(--body);font-variant-numeric:tabular-nums lining-nums;min-width:4.2ch}
.timer .lbl{font-size:17px;color:var(--muted);line-height:1.25}
.timer.run{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.timer.run .lbl{color:var(--ground);opacity:.75}
.timer.ring{background:var(--flame);border-color:var(--flame);color:#fff;animation:pulse .8s ease-in-out infinite alternate}
.timer.ring .lbl{color:#fff}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.02)}}
.mw{border-left:4px solid var(--copper);background:var(--surface);border-radius:4px 12px 12px 4px;padding:10px 14px}
.mw b{display:block;font:700 13px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--copper);margin-bottom:2px}
.mw p{margin:0;font-size:18px;line-height:1.38}
.check{display:flex;flex-direction:column;border-top:1.5px solid var(--line)}
.check label{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1.5px solid var(--line);cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--accent);margin:0}
.check .q{font-weight:700;font-variant-numeric:tabular-nums lining-nums;color:var(--accent);white-space:nowrap;text-align:right}
.check label:has(input:checked) .n{text-decoration:line-through;color:var(--muted)}
.gear{display:flex;flex-direction:column;border-top:1.5px solid var(--line)}
.gear div{display:grid;grid-template-columns:1fr 1.1fr;gap:12px;padding:9px 0;border-bottom:1.5px solid var(--line);font-size:18px;line-height:1.3}
.gear .w{color:var(--accent)}
.clockl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:18px;line-height:1.3}
.clockl .t{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.clockl .you{color:var(--ink)}
.clockl .oth{color:var(--muted)}
.case{display:flex;gap:14px;align-items:center}
.seal{flex-shrink:0;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:400 26px var(--display-sc);color:#f3d9c4;
  background:radial-gradient(circle at 35% 30%,var(--wax-lt),var(--wax) 60%,#4f1a15);box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.18)}
.kick{margin:0;font:700 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.sub{margin:4px 0 0;font-size:19px;color:var(--ink)}
.sub b{color:var(--accent)}
.evid{border:1.5px dashed var(--accent-2);border-radius:14px;padding:14px;background:rgba(122,42,34,.16);display:flex;flex-direction:column;gap:8px}
.evid h2{margin:0;font:400 26px var(--display)}
.evid p{margin:0;font-size:19px}
.evid b{color:var(--accent)}
.maplg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--muted)}
.maplg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dock{display:flex;gap:8px;flex-wrap:wrap}
.dock:empty{display:none}
.dock button{border:0;border-radius:999px;background:var(--ink);color:var(--ground);font:700 16px var(--body);padding:8px 14px;font-variant-numeric:tabular-nums lining-nums;cursor:pointer}
.dock button.ring{background:var(--flame);color:#fff}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding-block:8px calc(12px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;border-radius:14px;font:400 24px var(--display-sc);padding:14px 0;cursor:pointer}
.nav .back{background:var(--surface-2);color:var(--ink)}
.nav .next{background:var(--accent);color:var(--accent-ink)}
.nav button:disabled{opacity:.35;cursor:default}
button:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.fade{animation:in .18s ease-out}
@keyframes in{from{opacity:.4;transform:translateX(8px)}to{opacity:1;transform:none}}

/* "How?" chip + inline technique panel */
.ttl{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ttl h1{flex:1}
.how{flex-shrink:0;margin-top:4px;border:2px solid var(--accent);background:transparent;color:var(--accent);font:700 17px var(--body);letter-spacing:.04em;border-radius:999px;padding:6px 14px;cursor:pointer}
.how[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.howp{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.howp[hidden]{display:none}
.term{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center}
.term .mini{border-radius:10px;background:var(--surface-2);overflow:hidden}
.term .mini svg{width:100%;height:auto;display:block}
.term h3{margin:0 0 2px;font:400 20px var(--display);line-height:1.15;color:var(--accent)}
.term p{margin:0;font-size:17px;line-height:1.35;color:var(--ink)}
@media (max-width:360px){.term{grid-template-columns:1fr}.term .mini{max-width:220px}}

/* scene motion: .a = sequenced (runs on the scene clock --T), .m = small endless loops */
.sc text{font-family:var(--body);font-weight:700;letter-spacing:.03em}
.sc .a{animation-duration:var(--T,5s);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}
.sc .m{transform-box:fill-box;transform-origin:center}
@keyframes scin{0%{opacity:0}5%,100%{opacity:1}}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.86,.74)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}35%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
@keyframes fallm{0%{opacity:0;transform:translateY(-6px)}15%,80%{opacity:1}100%{opacity:0;transform:translateY(var(--fd,40px))}}
@keyframes pop{0%,50%{transform:scale(.2);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes shake{from{transform:translate(-2px,-2px)}to{transform:translate(2px,2px)}}
@keyframes squeeze{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
@keyframes pinch{from{transform:translateX(0)}to{transform:translateX(5px)}}
@keyframes circ{0%,100%{transform:translate(-7px,0)}25%{transform:translate(0,-2px)}50%{transform:translate(7px,0)}75%{transform:translate(0,2px)}}
@keyframes rub{0%,100%{transform:translate(0,0)}25%{transform:translate(10px,-4px)}50%{transform:translate(-4px,8px)}75%{transform:translate(8px,6px)}}
@keyframes wsw{from{transform:translate(-14px,0) rotate(-9deg)}to{transform:translate(14px,3px) rotate(9deg)}}
@keyframes jsh{from{transform:translate(-5px,-6px) rotate(-7deg)}to{transform:translate(5px,6px) rotate(7deg)}}
@keyframes tapm{0%,55%,100%{transform:none}70%{transform:translateY(3px) rotate(5deg)}}
@keyframes foldm{0%,100%{transform:translate(0,-8px)}30%{transform:translate(0,6px)}60%{transform:translate(-16px,4px)}85%{transform:translate(-18px,-8px)}}
@keyframes mashm{0%,100%{transform:translateY(-14px)}45%,60%{transform:translateY(4px)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{from{opacity:.35}to{opacity:1}}
@keyframes warmp{from{opacity:.06}to{opacity:.2}}
@keyframes sweep{0%,100%{transform:translate(0,0)}25%{transform:translate(60px,-10px)}50%{transform:translate(120px,4px)}75%{transform:translate(60px,12px)}}
@media (prefers-reduced-motion:reduce){
  .fade,.timer.ring{animation:none!important}
  /* sequenced art jumps straight to its final (done) frame; loops stop */
  .sc .a{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;animation-fill-mode:forwards!important}
  .sc .m{animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="bars" id="bars" aria-label="Steps"></div>
    <div class="meta"><span id="count"></span><span class="team">IV · The Alpine Lodge</span></div>
  </div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="dock" id="dock"></div>
  <nav class="nav">
    <button class="back" id="back">Back</button>
    <button class="next" id="next">Next</button>
  </nav>
</div>
<script>
// ---------- art kit: each step is a looping mini-scene (0% start → action → hold on the done state) ----------
// Sequenced parts use class "a" and run on the scene clock --T; positioning/rotation always lives on an OUTER
// <g transform> (see at()), animation on an inner <g>, so CSS never wipes out a rotation.
const kfDone=new Set();let kfEl=null;
const kf=(name,body)=>{if(!kfDone.has(name)){kfDone.add(name);if(!kfEl){kfEl=document.createElement('style');document.head.appendChild(kfEl)}kfEl.append(`@keyframes ${name}{${body}}`)}return name};
const A=(name,x='')=>`class="a" style="animation-name:${name};${x}"`;
const M=(anim,dur,delay=0,x='',alt=false)=>`class="m" style="animation:${anim} ${dur}s ${alt?'ease-in-out':'linear'} ${delay}s infinite${alt?' alternate':''};${x}"`;
const on=(p,x='')=>A(kf(`on${p}`,`0%,${p}%{opacity:var(--o0,0);transform:translate(var(--ox,0px),var(--oy,5px))}${p+4}%,100%{opacity:1;transform:none}`),x);
const off=(p,x='')=>A(kf(`off${p}`,`0%,${p}%{opacity:1}${p+4}%,100%{opacity:0}`),x);
const drop=(p,x='')=>A(kf(`drop${p}`,`0%,${p}%{opacity:0;transform:translateY(var(--dy,-80px))}${p+1}%{opacity:1;transform:translateY(var(--dy,-80px))}${p+7}%{opacity:1;transform:none}${p+9}%{transform:scale(1.1,.88)}${p+11}%,100%{opacity:1;transform:none}`),x);
const win=(a,b,inner,x='')=>`<g ${on(a,x)}><g ${off(b)}>${inner}</g></g>`;
const SC=(T,inner,h=180,w=240)=>`<svg viewBox="0 0 ${w} ${h}" aria-hidden="true" class="sc" style="--T:${T}s"><g ${A('scin')}>${inner}</g></svg>`;
const at=(x,y,inner,r=0,s=1)=>`<g transform="translate(${x} ${y})${r?` rotate(${r})`:''}${s!==1?` scale(${s})`:''}">${inner}</g>`;
const chip=(x,y,label,tone='ink',anchor='middle')=>{const w=Math.round(label.length*6.4+16),bg=tone==='ok'?'var(--green)':tone==='hot'?'var(--accent)':tone==='no'?'var(--flame)':tone==='ice'?'var(--ice)':tone==='wax'?'var(--wax)':'var(--ink)',fg=tone==='no'||tone==='wax'?'#fff':'var(--ground)',x0=anchor==='start'?x:x-w/2;return `<rect x="${x0}" y="${y-8.5}" width="${w}" height="17" rx="8.5" fill="${bg}"/><text x="${x0+w/2}" y="${y+3.6}" font-size="10" fill="${fg}" text-anchor="middle">${label}</text>`};
const cap=(t,a,b,tone)=>`<g ${on(a)}>${b==null?chip(120,12,t,tone):`<g ${off(b)}>${chip(120,12,t,tone)}</g>`}</g>`;
const list=(L,P,y0=34)=>L.map((t,i)=>`<g ${on(P[i],'--o0:.28;--oy:0px')}>${chip(6,y0+i*18,t,'ink','start')}</g>`).join('');
const bowlP=(cx,top,w,d)=>`M${cx-w/2} ${top} h${w} q${-w*.06} ${d} ${-w/2} ${d} q${-w*.44} 0 ${-w/2} ${-d} z`;
const bowl=(cx,top,w,d)=>`<path d="${bowlP(cx,top,w,d)}" fill="var(--surface-3)" stroke="var(--steel)" stroke-width="1.5"/>`;
const rim=(cx,top,w)=>`<path d="M${cx-w/2-2} ${top} h${w+4}" stroke="var(--steel)" stroke-width="3" stroke-linecap="round" fill="none"/>`;
// small glass bowl (side-on): glass → contents → outline
const gb=(cx,top,w,d,fill='',fa='')=>`<path d="${bowlP(cx,top,w,d)}" fill="var(--glass)" opacity=".5"/>${fill?`<path d="${bowlP(cx,top+5,w-8,d-5)}" fill="${fill}" ${fa}/>`:''}<path d="${bowlP(cx,top,w,d)}" fill="none" stroke="var(--glass-ln)" stroke-width="1.6"/><path d="M${cx-w/2-2} ${top} h${w+4}" stroke="var(--glass-ln)" stroke-width="3" stroke-linecap="round" fill="none"/>`;
// countdown ring that fills from a% to b%
const ring=(cx,cy,label,a,b)=>`<circle cx="${cx}" cy="${cy}" r="15" fill="var(--ground)"/><circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="var(--line)" stroke-width="5"/><path d="M${cx} ${cy-10} a10 10 0 1 1 0 20 a10 10 0 1 1 0 -20" fill="none" stroke="var(--accent)" stroke-width="5" pathLength="100" stroke-dasharray="100 100" ${A(kf(`rf${a}_${b}`,`0%,${a}%{stroke-dashoffset:100}${b}%,100%{stroke-dashoffset:0}`),'animation-timing-function:linear')}/>${label?`<text x="${cx}" y="${cy+28}" font-size="11" fill="var(--ink)" text-anchor="middle">${label}</text>`:''}`;
const steam=(xs,y)=>xs.map((x,i)=>`<path ${M('steam',2.4,+(i*.8).toFixed(2))} d="M${x} ${y} q-7 -9 0 -18 q7 -9 0 -18" stroke="var(--muted)" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('');
const bits=(xs,y,fill,fd=40,r=2)=>xs.map((x,i)=>`<circle ${M('fallm',1.1,+(i*.22).toFixed(2),`--fd:${fd}px`)} cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');
const pops=(pts,d=1.2,r=3.5,f='var(--syrup-lt)')=>pts.map(([x,y],i)=>`<circle ${M('pop',d,+(i*d/pts.length).toFixed(2))} cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`).join('');
const cut=(d,a,b,w=2.5,c='var(--flesh-dk)')=>`<path d="${d}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none" pathLength="100" stroke-dasharray="100 100" ${A(kf(`ct${a}_${b}`,`0%,${a}%{stroke-dashoffset:100}${b}%,100%{stroke-dashoffset:0}`),'animation-timing-function:linear')}/>`;
const dots=(pts,f,r,st='')=>pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${st?` stroke="${st}" stroke-width=".8"`:''}/>`).join('');
const tear=(f,st='')=>`<path d="M0 -8 Q6 0 0 4 Q-6 0 0 -8Z" fill="${f}"${st?` stroke="${st}" stroke-width="1"`:''}/>`;
// a tool that pokes down at each point in turn (global coords, tool tip at 0,0); returns [keyframe, poke-times]
const pokes=(name,pts,p0,step,lift=24)=>{const d=Math.round(step*.35),u=Math.round(step*.7),P=pts.map((_,i)=>p0+i*step);
  let s=`0%,${p0-2}%{opacity:0;transform:translate(${pts[0][0]}px,${pts[0][1]-lift}px)}`;
  pts.forEach(([x,y],i)=>{const p=P[i];s+=`${p}%{opacity:1;transform:translate(${x}px,${y-lift}px)}${p+d}%{opacity:1;transform:translate(${x}px,${y+2}px)}${p+u}%{opacity:1;transform:translate(${x}px,${y-lift}px)}`});
  const e=P.at(-1)+u,[lx,ly]=pts.at(-1);s+=`${e+3}%,100%{opacity:0;transform:translate(${lx}px,${ly-lift}px)}`;
  return [kf(name,s),P.map(p=>p+d)]};
// scale LCD: [text, from%, to%] windows (from 0 = shown at start, to 100 = the done reading)
const lcdWin=(a,b)=>kf(`lw${a}_${b}`,a===0?`0%,${b}%{opacity:1}${b+.5}%,100%{opacity:0}`:b===100?`0%,${a}%{opacity:0}${a+.5}%,100%{opacity:1}`:`0%,${a}%{opacity:0}${a+.5}%,${b}%{opacity:1}${b+.5}%,100%{opacity:0}`);
const SCALE=(cx,y,seq)=>`<rect x="${cx-62}" y="${y}" width="124" height="24" rx="7" fill="var(--steel)"/><rect x="${cx-26}" y="${y+5}" width="52" height="15" rx="3" fill="var(--screen)"/><rect x="${cx+32}" y="${y+6}" width="24" height="13" rx="6.5" fill="var(--ground)"/><text x="${cx+44}" y="${y+15.3}" font-size="7" fill="var(--ink)" text-anchor="middle">TARE</text>`+
  seq.map(([t,a,b])=>`<g ${A(lcdWin(a,b))}><text x="${cx}" y="${y+16.5}" font-size="11" fill="var(--lcd)" text-anchor="middle">${t}</text></g>`).join('');
const HL='fill="var(--hand)" stroke="var(--hand-ln)" stroke-width="1.5"';

// ---------- engine ----------
const store={get(k,d){try{const v=localStorage.getItem(STORE_KEY+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(STORE_KEY+k,JSON.stringify(v))}catch{}}};
const hashStep=/^#(\d+)h?$/.exec(location.hash||'');
let cur=Math.max(0,Math.min(hashStep?+hashStep[1]:(+store.get('step',0)||0),STEPS.length-1)), checked=store.get('checked',{})||{};
const timers={}; let audio;
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
// "Go" is ~4:00 pm (T+0)
const clockAt=m=>{const t=16*60+m,h=Math.floor(t/60)%12||12;return `${h}:${String(t%60).padStart(2,'0')}`};
const tTag=s=>s.tm?`≈ T+${s.tm[0]}${s.tm[1]!=null?`–${s.tm[1]}`:''} min · ~${clockAt(s.tm[0])} pm`:'';
function timerFor(t){if(!timers[t.id])timers[t.id]={total:t.min*60,left:t.min*60,running:false,ring:false,label:t.label};return timers[t.id]}
const tLeft=T=>T.running?(T.endAt-Date.now())/1000:T.left;
function toggleTimer(id){const T=timers[id];if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch{}}
  if(T.ring){T.ring=false;T.running=false;T.left=T.total}else if(T.running){T.left=tLeft(T);T.running=false}else{T.endAt=Date.now()+T.left*1000;T.running=true}paintTimers()}
function beep(){try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch{}if(!audio)return;
  try{[0,.35,.7].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.25,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d+.3);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.3)})}catch{}}
function paintTimers(){
  for(const[id,T]of Object.entries(timers)){
    if(T.running&&tLeft(T)<=0){T.running=false;T.left=0;T.ring=true;beep()}
    const el=document.querySelector(`[data-timer="${id}"]`);
    if(el){el.className='timer'+(T.ring?' ring':T.running?' run':'');el.querySelector('.clock').textContent=T.ring?'Done':fmt(tLeft(T));
      el.querySelector('.lbl').textContent=T.ring?`${T.label}: time! Tap to reset`:T.running?`${T.label} · running · tap to pause`:(T.left<T.total?`${T.label} · paused · tap to resume`:`${T.label} · tap to start`)}}
  const here=STEPS[cur].timer?.id;
  $('dock').innerHTML=Object.entries(timers).filter(([id,T])=>(T.running||T.ring)&&id!==here).map(([id,T])=>`<button class="${T.ring?'ring':''}" data-dock="${id}">${T.label} ${T.ring?'done!':fmt(tLeft(T))}</button>`).join('');
}
setInterval(paintTimers,250);

function render(){
  const s=STEPS[cur];
  $('bars').innerHTML=STEPS.map((_,i)=>`<button aria-label="${i?`Step ${i}`:'Your station'}" class="${i<cur?'done':i===cur?'cur':''}" data-go="${i}"></button>`).join('');
  $('count').textContent=cur===0?'Your station':`Step ${cur} of ${STEPS.length-1}`;
  let h='';
  if(s.kind==='station'){h=station()}
  else{
    const hk=s.how||[];
    const how=hk.length?`<button class="how" id="howbtn" data-how aria-expanded="false" aria-controls="howp">How?</button>`:'';
    const howp=hk.length?`<div class="howp" id="howp" hidden>${hk.map(k=>`<div class="term"><div class="mini">${HOW[k].art}</div><div><h3>${HOW[k].t}</h3><p>${HOW[k].d}</p></div></div>`).join('')}</div>`:'';
    const tag=`<span class="tag"${s.secret?' style="background:var(--wax);color:#fff;border-color:var(--wax-lt)"':''}>${s.secret?'The secret ingredient · ':''}${tTag(s)}</span>`;
    h=`${tag}<div class="art">${ART[s.art]}</div><div class="ttl"><h1>${s.title}</h1>${how}</div>${howp}<p class="detail">${s.detail}</p>`;
    if(s.timer){const T=timerFor(s.timer);h+=`<button class="timer" data-timer="${s.timer.id}"><span class="clock">${fmt(tLeft(T))}</span><span class="lbl"></span></button>`}
    if(s.ings)h+=`<div class="ings">`+s.ings.map(([n,q,note])=>`<div class="q">${q}</div><div class="n">${n}${note?`<small>${note}</small>`:''}</div>`).join('')+`</div>`;
    if(s.mw)h+=`<div class="mw"><b>Meanwhile in the kitchen</b><p>${s.mw}</p></div>`;
    if(s.note)h+=`<p class="note">${s.note}</p>`;
  }
  const st=$('stage');st.innerHTML=h;st.scrollTop=0;st.classList.remove('fade');void st.offsetWidth;st.classList.add('fade');
  $('back').disabled=cur===0;$('next').textContent=cur===0?'Start cooking':cur===STEPS.length-1?'Done':'Next';$('next').disabled=cur===STEPS.length-1;
  store.set('step',cur);paintTimers();
}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();wake()}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return go(+g.dataset.go);
  const hw=e.target.closest('[data-how]');if(hw){const p=$('howp'),open=p.hidden;p.hidden=!open;hw.setAttribute('aria-expanded',open);hw.textContent=open?'Close':'How?';return}
  const t=e.target.closest('[data-timer]');if(t)return toggleTimer(t.dataset.timer);
  const d=e.target.closest('[data-dock]');if(d){const id=d.dataset.dock;if(timers[id].ring)toggleTimer(id);return go(STEPS.findIndex(s=>s.timer?.id===id))}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-ck]');if(c){checked[c.dataset.ck]=c.checked;store.set('checked',checked)}});
$('next').onclick=()=>go(cur+1);$('back').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let tx=null,ty=null;
$('stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('stage').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));tx=null},{passive:true});
let lock=null;async function wake(){try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
render();
if(/h$/.test(location.hash))document.querySelector('[data-how]')?.click();
</script>
</body>
</html>
