<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121a15">
<title>Case No. 08 · I · The Apothecary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#121a15; --surface:#1a241e; --surface-2:#22302a;
  --ink:#f3e7cf; --muted:#b9ae95; --line:#33453a;
  --accent:#e0a868; --accent-ink:#1b130a; --accent-soft:#3a2f1e;
  --gold:#c9a15a; --copper:#d8955f; --wax:#7a2a22; --wax-hi:#a5382c;
  --green:#9cc98a; --green-soft:#23372a;
  --pork:#D7928A; --pork-ln:#C77E74; --pink:#E3857E; --meat-in:#E2B6A4; --grey:#B9ABA3;
  --sear1:#B8743F; --crust:#84451F; --crust-d:#5A2C11; --glaze:#7A3E1C; --glaze-d:#53260E;
  --ev1:#5a1f1a; --ev1-lt:#8a3a2c; --ev2:#4a3020; --ev2-lt:#6e4a30;
  --mustard:#C9962A; --mustard-lt:#E6BE5A; --sugar:#9a6634; --sugar-lt:#c08850;
  --vin:#3E2616; --garlic:#E0D5B8; --thyme:#7d8f3c;
  --silver:#D5DEE4; --silver-ln:#B7C4CC; --board:#8A6A45; --board-ln:#6A4F32;
  --foil:#9DA3A8; --foil-ln:#6E757B; --oil:#E9C765; --fond:#5E2C10;
  --stock:#B07A4A; --sauce-lt:#A0673E; --sauce:#6E3A1C; --towel:#EDE7DE; --sheet:#6F6962;
  --butter:#F3D56E; --butter-ln:#D2B24A; --cream-ln:#9C8C74;
  --glass:#3F6470; --glass-ln:#8FC3D4; --water:#4E8AA6;
  --pan:#4A443E; --pan-rim:#6C645C; --steel:#8E887F; --flame:#E4571C; --honey:#F2B33A; --eye:#20130B;
  --hand:#D8A987; --hand-ln:#A5724D; --plate:#E8E1D6; --screen:#0c0907; --lcd:#FFC46B;
  --bag:#cfe0e6; --tub:#efe6d2; --tub-ln:#9c8f74; --lid:#2a2a2a; --spud:#b5653a; --spud-ln:#7e3f1e;
  --cloth:#2d4236; --wood:#6a4a2e; --wax-candle:#f3e7cf;
  --display:"IM Fell English",Georgia,"Times New Roman",serif;
  --display-sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  --body:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --sans:-apple-system,"Helvetica Neue",Arial,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--ground);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 90% 50% at 50% 30%,rgba(216,149,95,.07),transparent 70%),radial-gradient(ellipse 120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-inline:16px;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;flex-direction:column;gap:10px;padding-block:12px 4px}
.bars{display:flex;gap:3px}
.bars button{flex:1;height:6px;border:0;border-radius:3px;background:var(--line);padding:0;cursor:pointer}
.bars button.done{background:var(--gold)}
.bars button.cur{background:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:15px var(--display-sc);color:var(--muted);letter-spacing:.04em}
.clockbtn{flex-shrink:0;border:1.5px solid var(--gold);background:transparent;color:var(--accent);font:600 15px var(--body);border-radius:999px;padding:5px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.clockbtn.on{background:var(--gold);color:var(--accent-ink)}
.stage{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-block:8px 16px}
.stage>*{flex-shrink:0}
.gearh{margin:4px 0 0;font:16px var(--display-sc);letter-spacing:.06em;color:var(--accent)}
.tag{align-self:flex-start;font:600 14px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:4px;background:var(--wax);color:var(--ink)}
.tag.g{background:var(--green-soft);color:var(--green)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(31px,8.6vw,42px);line-height:1.05;margin:0;text-wrap:balance;color:var(--ink)}
h2{font:22px var(--display);margin:0;color:var(--accent)}
.detail{font-size:20px;margin:0;max-width:36ch}
.detail b{color:var(--accent);font-weight:600}
.note{font-size:17px;margin:0;color:var(--muted)}
.art{width:100%;max-width:380px;align-self:center;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.art.map{max-width:520px}
.art svg{width:100%;height:auto;display:block}
.ings{display:grid;grid-template-columns:auto 1fr;border-top:1.5px solid var(--line)}
.ings div{padding:10px 0;border-bottom:1.5px solid var(--line)}
.ings .q{font-weight:700;font-variant-numeric:tabular-nums lining-nums;padding-right:16px;white-space:nowrap;color:var(--accent)}
.ings .n small,.check .n small,.where small{display:block;color:var(--muted);font-size:16px}
.ings .ev .n{color:var(--ink)}
.evl{display:inline-block;font:600 12px var(--sans);letter-spacing:.06em;background:var(--wax);color:var(--ink);border-radius:3px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.timer{display:flex;align-items:center;gap:14px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);padding:14px 16px;font:inherit;cursor:pointer;text-align:left;width:100%}
.timer .clock{font:600 36px var(--body);font-variant-numeric:tabular-nums lining-nums;min-width:4.2ch}
.timer .lbl{font-size:17px;color:var(--muted)}
.timer.run{background:var(--ink);color:var(--ground)}
.timer.run .lbl{color:var(--ground);opacity:.75}
.timer.ring{background:var(--flame);color:#fff;animation:pulse .8s ease-in-out infinite alternate}
.timer.ring .lbl{color:#fff}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.02)}}
.check{display:flex;flex-direction:column;border-top:1.5px solid var(--line)}
.check label{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1.5px solid var(--line);cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--gold);margin:0}
.check .q{font-weight:700;font-variant-numeric:tabular-nums lining-nums;color:var(--accent);white-space:nowrap;text-align:right}
.check label:has(input:checked) .n{text-decoration:line-through;color:var(--muted)}
.where{display:grid;grid-template-columns:auto 1fr;border-top:1.5px solid var(--line)}
.where div{padding:10px 0;border-bottom:1.5px solid var(--line)}
.where .k{font-weight:600;padding-right:14px;color:var(--ink)}
.where .v{color:var(--ink)}
.where .v b{color:var(--accent);font-weight:600}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.facts span{background:var(--surface-2);border-radius:6px;padding:7px 11px;font-weight:600;font-size:17px;font-variant-numeric:lining-nums}
.mw{border-left:3px solid var(--copper);background:var(--surface);border-radius:0 10px 10px 0;padding:10px 14px}
.mw h3{margin:0 0 4px;font:16px var(--display-sc);letter-spacing:.05em;color:var(--copper)}
.mw p{margin:0;font-size:18px}
.mw p+p{margin-top:6px}
.mw b{color:var(--accent);font-weight:600}
.dock{display:flex;gap:8px;flex-wrap:wrap}
.dock:empty{display:none}
.dock button{border:0;border-radius:999px;background:var(--ink);color:var(--ground);font:700 16px var(--body);padding:8px 14px;font-variant-numeric:tabular-nums lining-nums;cursor:pointer}
.dock button.ring{background:var(--flame);color:#fff}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding-block:8px calc(12px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;border-radius:12px;font:22px var(--display-sc);letter-spacing:.04em;padding:15px 0;cursor:pointer}
.nav .back{background:var(--surface-2);color:var(--ink)}
.nav .next{background:var(--accent);color:var(--accent-ink)}
.nav button:disabled{opacity:.35;cursor:default}
button:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.fade{animation:in .18s ease-out}
@keyframes in{from{opacity:.4;transform:translateX(8px)}to{opacity:1;transform:none}}
.ttl{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ttl h1{flex:1}
.how{flex-shrink:0;margin-top:4px;border:2px solid var(--accent);background:transparent;color:var(--accent);font:700 17px var(--body);letter-spacing:.03em;border-radius:999px;padding:6px 14px;cursor:pointer}
.how[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.howp{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.howp[hidden]{display:none}
.term{display:grid;grid-template-columns:136px 1fr;gap:12px;align-items:center}
.term .mini{border-radius:10px;background:var(--surface-2);overflow:hidden}
.term .mini svg{width:100%;height:auto;display:block}
.term h3{margin:0 0 2px;font:19px var(--display);color:var(--accent)}
.term p{margin:0;font-size:17px;line-height:1.35}
@media (max-width:360px){.term{grid-template-columns:1fr}.term .mini{max-width:220px}}
.sc text{font-family:var(--sans);font-weight:700;letter-spacing:.02em}
.sc .a{animation-duration:var(--T,5s);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}
.sc .m{transform-box:fill-box;transform-origin:center}
@keyframes scin{0%{opacity:0}5%,100%{opacity:1}}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.88,.78)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}35%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
@keyframes fallm{0%{opacity:0;transform:translateY(-6px)}15%,80%{opacity:1}100%{opacity:0;transform:translateY(var(--fd,40px))}}
@keyframes pop{0%,50%{transform:scale(.2);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes sz{from{opacity:1}to{opacity:.25}}
@keyframes shake{from{transform:translate(-2px,-2px)}to{transform:translate(2px,2px)}}
@keyframes circ{0%,100%{transform:translate(-7px,0)}25%{transform:translate(0,-2px)}50%{transform:translate(7px,0)}75%{transform:translate(0,2px)}}
@keyframes rub{0%,100%{transform:translate(0,0)}25%{transform:translate(10px,-4px)}50%{transform:translate(-4px,8px)}75%{transform:translate(8px,6px)}}
@keyframes glow{from{opacity:1}to{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  .fade,.timer.ring{animation:none!important}
  .sc .a{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;animation-fill-mode:forwards!important}
  .sc .m{animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="bars" id="bars" aria-label="Steps"></div>
    <div class="meta"><span id="count"></span><button class="clockbtn" id="clock" type="button"></button></div>
  </div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="dock" id="dock"></div>
  <nav class="nav">
    <button class="back" id="back" type="button">Back</button>
    <button class="next" id="next" type="button">Next</button>
  </nav>
</div>
<script>
// ---------- art kit: each step is a looping mini-scene (0% start → action → hold on the done state) ----------
// Sequenced parts use class "a" and run on the scene clock --T; positioning/rotation lives on an OUTER
// <g transform> (see at()), animation on an inner <g>, so CSS never wipes out an SVG transform.
const kfDone=new Set();let kfEl=null;
const kf=(name,body)=>{if(!kfDone.has(name)){kfDone.add(name);if(!kfEl){kfEl=document.createElement('style');document.head.appendChild(kfEl)}kfEl.append(`@keyframes ${name}{${body}}`)}return name};
const A=(name,x='')=>`class="a" style="animation-name:${name};${x}"`;
const M=(anim,dur,delay=0,x='',alt=false)=>`class="m" style="animation:${anim} ${dur}s ${alt?'ease-in-out':'linear'} ${delay}s infinite${alt?' alternate':''};${x}"`;
const on=(p,x='')=>A(kf(`on${p}`,`0%,${p}%{opacity:var(--o0,0);transform:translate(var(--ox,0px),var(--oy,5px))}${p+4}%,100%{opacity:1;transform:none}`),x);
const off=(p,x='')=>A(kf(`off${p}`,`0%,${p}%{opacity:1}${p+4}%,100%{opacity:0}`),x);
const drop=(p,x='')=>A(kf(`drop${p}`,`0%,${p}%{opacity:0;transform:translateY(var(--dy,-80px))}${p+1}%{opacity:1;transform:translateY(var(--dy,-80px))}${p+7}%{opacity:1;transform:none}${p+9}%{transform:scale(1.1,.88)}${p+11}%,100%{opacity:1;transform:none}`),x);
const win=(a,b,inner,x='')=>`<g ${on(a,x)}><g ${off(b)}>${inner}</g></g>`;
const SC=(T,inner,h=180,w=240)=>`<svg viewBox="0 0 ${w} ${h}" aria-hidden="true" class="sc" style="--T:${T}s"><g ${A('scin')}>${inner}</g></svg>`;
const at=(x,y,inner,r=0,s=1)=>`<g transform="translate(${x} ${y})${r?` rotate(${r})`:''}${s!==1?` scale(${s})`:''}">${inner}</g>`;
const chip=(x,y,label,tone='ink',anchor='middle')=>{const w=Math.round(label.length*6.5+14),bg=tone==='ok'?'var(--green)':tone==='hot'?'var(--accent)':tone==='no'?'var(--flame)':tone==='ev'?'var(--wax)':'var(--ink)',fg=tone==='hot'?'var(--accent-ink)':tone==='no'||tone==='ev'?'#fff':'var(--ground)',x0=anchor==='start'?x:x-w/2;return `<rect x="${x0}" y="${y-8.5}" width="${w}" height="17" rx="8.5" fill="${bg}"/><text x="${x0+w/2}" y="${y+3.6}" font-size="10" fill="${fg}" text-anchor="middle">${label}</text>`};
const cap=(t,a,b,tone)=>`<g ${on(a)}>${b==null?chip(120,12,t,tone):`<g ${off(b)}>${chip(120,12,t,tone)}</g>`}</g>`;
const list=(L,P,y0=34,tone='ink')=>L.map((t,i)=>`<g ${on(P[i],'--o0:.28;--oy:0px')}>${chip(6,y0+i*18,t,Array.isArray(tone)?tone[i]:tone,'start')}</g>`).join('');
const bowlP=(cx,top,w,d)=>`M${cx-w/2} ${top} h${w} q${-w*.06} ${d} ${-w/2} ${d} q${-w*.44} 0 ${-w/2} ${-d} z`;
// small glass bowl (side-on): glass → contents → outline
const gb=(cx,top,w,d,fill='',fa='')=>`<path d="${bowlP(cx,top,w,d)}" fill="var(--glass)" opacity=".5"/>${fill?`<path d="${bowlP(cx,top+5,w-8,d-5)}" fill="${fill}" ${fa}/>`:''}<path d="${bowlP(cx,top,w,d)}" fill="none" stroke="var(--glass-ln)" stroke-width="1.6"/><path d="M${cx-w/2-2} ${top} h${w+4}" stroke="var(--glass-ln)" stroke-width="3" stroke-linecap="round" fill="none"/>`;
// heat: always flames under the pan, 1 low · 2 medium · 3 medium-high · 4 high
const flame=i=>`<g ${M('flick',.45+.12*(i%3),0,'transform-origin:50% 100%',true)}><path d="M-8 0 Q-10 -11 0 -22 Q10 -11 8 0 Z" fill="var(--flame)"/><path d="M-4 0 Q-5 -6 0 -12 Q5 -6 4 0 Z" fill="var(--honey)"/></g>`;
const flames=(n,cx=110,y=178,sp=20)=>[...Array(n)].map((_,i)=>at(cx+(i-(n-1)/2)*sp,y,flame(i))).join('');
const ring=(cx,cy,label,a,b)=>`<circle cx="${cx}" cy="${cy}" r="15" fill="var(--ground)"/><circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="var(--line)" stroke-width="5"/><path d="M${cx} ${cy-10} a10 10 0 1 1 0 20 a10 10 0 1 1 0 -20" fill="none" stroke="var(--accent)" stroke-width="5" pathLength="100" stroke-dasharray="100 100" ${A(kf(`rf${a}_${b}`,`0%,${a}%{stroke-dashoffset:100}${b}%,100%{stroke-dashoffset:0}`),'animation-timing-function:linear')}/><text x="${cx}" y="${cy+28}" font-size="11" fill="var(--ink)" text-anchor="middle">${label}</text>`;
const steam=(xs,y)=>xs.map((x,i)=>`<path ${M('steam',2.4,i*.8)} d="M${x} ${y} q-7 -9 0 -18 q7 -9 0 -18" stroke="var(--muted)" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('');
const bits=(xs,y,fill,fd=40,r=2)=>xs.map((x,i)=>`<circle ${M('fallm',1.1,i*.22,`--fd:${fd}px`)} cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');
const pops=(pts,d=1.2,r=3.5,f='#fff')=>pts.map(([x,y],i)=>`<circle ${M('pop',d,+(i*d/pts.length).toFixed(2))} cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`).join('');
const cut=(d,a,b,w=2.5,c='var(--crust-d)')=>`<path d="${d}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none" pathLength="100" stroke-dasharray="100 100" ${A(kf(`ct${a}_${b}`,`0%,${a}%{stroke-dashoffset:100}${b}%,100%{stroke-dashoffset:0}`),'animation-timing-function:linear')}/>`;
const dots=(pts,f,r,st='')=>pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${st?` stroke="${st}" stroke-width=".8"`:''}/>`).join('');
const specks=(pts,r=1.6,f='var(--eye)')=>pts.map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="${r*1.4}" ry="${r}" fill="${f}" opacity=".85"/>`).join('');
const tear=(f,st='')=>`<path d="M0 -8 Q6 0 0 4 Q-6 0 0 -8Z" fill="${f}"${st?` stroke="${st}" stroke-width="1"`:''}/>`;
// food + tools (drawn around 0,0 so at() can place/rotate them)
const HL='fill="var(--hand)" stroke="var(--hand-ln)" stroke-width="1.5"';
const HAND=`<ellipse cx="0" cy="-6" rx="9" ry="7" ${HL}/><ellipse cx="4" cy="1" rx="4" ry="3" ${HL}/>`;
const FINGER=`<rect x="-5" y="-38" width="10" height="36" rx="5" ${HL}/>`;
const dol=(f,l)=>`<path d="M-12 5 Q-13 -3 -5 -5 Q-3 -13 3 -9 Q5 -15 8 -8 Q13 -4 12 5 Z" fill="${f}"/><path d="M-6 -1 q5 -4 10 0 M-2 -6 q3 -2 5 0" stroke="${l}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
const whisk=`<rect x="-3" y="-66" width="6" height="26" rx="3" fill="var(--pan-rim)"/><path d="M-2 -40 C-14 -20 -10 2 0 2 C10 2 14 -20 2 -40 M-1 -40 C-6 -20 -5 0 0 0 C5 0 6 -20 1 -40" stroke="var(--steel)" stroke-width="2.5" fill="none"/>`;
const spoon=`<path d="M3 -3 L24 -50" stroke="var(--steel)" stroke-width="4" stroke-linecap="round" fill="none"/><ellipse rx="8" ry="4.5" fill="var(--steel)"/>`;
// fork, tines at 0,0 pointing down
const FORK=`<path d="M-5 0 V-12 M-1.7 0 V-12 M1.7 0 V-12 M5 0 V-12" stroke="var(--steel)" stroke-width="1.8" stroke-linecap="round"/><path d="M-6 -11 Q0 -17 6 -11" fill="var(--steel)"/><rect x="-2" y="-58" width="4" height="46" rx="2" fill="var(--steel)"/>`;
const KNIFE=`<path d="M-3 0 L-3 -34 L4 -34 L4 -6 Z" fill="var(--steel)"/><rect x="-4" y="-54" width="8" height="21" rx="3" fill="var(--pan-rim)"/>`;
// knife lying on its side, tip at 0,0 pointing left (for trimming)
const PK=`<path d="M0 0 Q14 -6 42 -6 L42 3 L4 3 Z" fill="var(--steel)" stroke="var(--pan-rim)" stroke-width=".8"/><rect x="41" y="-7" width="28" height="11" rx="4" fill="var(--pan-rim)"/>`;
// tongs, tips at 0,0 pointing down
const TONGS=`<path d="M-2 -64 L-7 -4 Q-7 0 -3 0 M2 -64 L7 -4 Q7 0 3 0" stroke="var(--steel)" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="-5" y="-70" width="10" height="10" rx="3" fill="var(--pan-rim)"/>`;
// instant-read thermometer, probe tip at 0,0 pointing down; lcd = text layers at y -79
const THERM=lcd=>`<rect x="-1.5" y="-48" width="3" height="46" fill="var(--steel)"/><path d="M-1.5 -2 L0 3 L1.5 -2Z" fill="var(--steel)"/><rect x="-18" y="-96" width="36" height="50" rx="8" fill="var(--flame)"/><rect x="-14" y="-90" width="28" height="15" rx="2" fill="var(--screen)"/><circle cx="0" cy="-60" r="4" fill="#fff" opacity=".5"/>${lcd}`;
// kitchen scale (top 150), LCD text at 174,163.5
const SCALE=(lcd='TARE')=>`<rect x="124" y="150" width="100" height="20" rx="5" fill="var(--steel)"/><rect x="154" y="154" width="40" height="12" rx="2" fill="var(--screen)"/><text x="174" y="163.5" font-size="8" fill="var(--lcd)" text-anchor="middle">${lcd}</text>`;
// pan, side-on: back rim → liquid → food → front wall. hs = handle side (1 right, -1 left), hl = handle length

const LID=`<rect x="-17" y="-18" width="34" height="7" rx="2" fill="var(--lid)"/>`;
const BAGBODY=`<path d="M-30 -32 H30 V38 Q30 44 24 44 H-24 Q-30 44 -30 38Z" fill="var(--bag)" opacity=".16" stroke="var(--bag)" stroke-width="1.5" stroke-opacity=".7"/><path d="M-22 -24 V30" stroke="#fff" stroke-width="2" opacity=".25" stroke-linecap="round"/>`;
const TAPE=r=>`<rect x="-36" y="-40" width="72" height="13" rx="2" fill="var(--wax)"/><text x="0" y="-30.5" font-size="8" fill="#fff" text-anchor="middle">EVIDENCE ${r}</text>`;

// Opening scene: tape off → tub out → lid off → tipped over the target → ALL of it in.
// o = {r, fill (contents), tx, ty (target mouth), base (target, drawn first), after (done look, on from 60%),
//      top (drawn over the tub path, e.g. pan front), caps, extra, T}
function evArt(o){const{r,fill,tx,ty}=o,bx=54,by=104;
  const tub=kf(`ev-tub${r}`,`0%,22%{transform:translate(${bx}px,${by+8}px)}32%,40%{transform:translate(${tx}px,${ty-56}px)}48%,64%{transform:translate(${tx+16}px,${ty-36}px) rotate(-120deg)}68%{transform:translate(${tx+16}px,${ty-36}px) rotate(-135deg)}76%,100%{opacity:0;transform:translate(${tx+70}px,${ty-80}px) rotate(-60deg)}`);
  const lid=kf(`ev-lid${r}`,'0%,38%{opacity:1;transform:none}44%,100%{opacity:0;transform:translate(14px,-26px) rotate(40deg)}');
  return SC(o.T||8,`${o.base}
    <g ${off(26)}>${at(bx,by,BAGBODY+SEAL)}</g>
    ${at(bx,by,`<g ${A(kf(`ev-tp${r}`,'0%,12%{opacity:1;transform:none}22%,100%{opacity:0;transform:translate(-18px,-30px) rotate(-28deg)}'))}>${TAPE(r)}</g>`)}
    <g ${A(tub,'transform-box:view-box;transform-origin:0 0')}>${TUB(r)}<g ${A(lid)}>${LID}</g></g>
    <path d="M${tx} ${ty-30} Q${tx-3} ${ty-14} ${tx} ${ty}" stroke="${fill}" stroke-width="9" stroke-linecap="round" fill="none" ${A(kf(`ev-st${r}`,'0%,49%{opacity:0}52%,62%{opacity:1}66%,100%{opacity:0}'))}/>
    ${at(tx,ty,`<g ${drop(50,'--dy:-26px')}>${dol(fill,'var(--tub)')}</g>`)}
    <g ${on(60,'--oy:0px')}>${o.after||''}</g>
    ${o.top||''}${o.extra||''}
    <g ${on(52)}><g ${off(78)}>${chip(tx,ty-74,`ALL OF EVIDENCE ${r}`,'ev')}</g></g>
    ${o.caps||`${cap('SEALED UNTIL THIS STEP',0,12)}${cap('PEEL THE TAPE · OPEN THE BAG',14,30)}${cap('LID OFF',32,46)}${cap('ALL OF IT IN · SCRAPE IT OUT',48,80,'ev')}${cap('THE SECRET INGREDIENT IS IN ✓',82,null,'ok')}`}`)}

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};

const timers={}; let audio;
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function timerFor(t){if(!timers[t.id])timers[t.id]={total:t.min*60,left:t.min*60,running:false,ring:false,label:t.label};return timers[t.id]}
const tLeft=T=>T.running?(T.endAt-Date.now())/1000:T.left;
function unlockAudio(){if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch{}}}
function toggleTimer(id){const T=timers[id];unlockAudio();
  if(T.ring){T.ring=false;T.running=false;T.left=T.total}else if(T.running){T.left=tLeft(T);T.running=false}else{T.endAt=Date.now()+T.left*1000;T.running=true}paintTimers()}
function beep(){try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch{}if(!audio)return;
  try{[0,.35,.7].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.25,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d+.3);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.3)})}catch{}}
// case clock: minutes since the host's "Go" (T0), shared by every team page on this phone
function paintClock(){const b=$('clock');if(goAt==null){b.className='clockbtn';b.textContent='Start T0 clock';return}
  const m=Math.floor((Date.now()-goAt)/60000);b.className='clockbtn on';b.textContent=`T+${m} min`}
function paintTimers(){
  for(const[id,T]of Object.entries(timers)){
    if(T.running&&tLeft(T)<=0){T.running=false;T.left=0;T.ring=true;beep()}
    const el=document.querySelector(`[data-timer="${id}"]`);
    if(el){el.className='timer'+(T.ring?' ring':T.running?' run':'');el.querySelector('.clock').textContent=T.ring?'Done':fmt(tLeft(T));
      el.querySelector('.lbl').textContent=T.ring?'Tap to reset':T.running?'Running · tap to pause':(T.left<T.total?'Paused · tap to resume':`Tap to start · ${T.label}`)}}
  const here=STEPS[cur].timer?.id;
  $('dock').innerHTML=Object.entries(timers).filter(([id,T])=>(T.running||T.ring)&&id!==here).map(([id,T])=>`<button class="${T.ring?'ring':''}" data-dock="${id}">${T.label} ${T.ring?'done!':fmt(tLeft(T))}</button>`).join('');
  paintClock();
}
setInterval(paintTimers,250);

  let h='';

      <div class="art map">${mapArt(s.spots)}</div>

  }else if(s.kind==='check'){
    h=`${tag}<h1>${s.title}</h1>${s.detail?`<p class="detail">${s.detail}</p>`:''}<p class="gearh">Gear</p><div class="facts">${s.gearList.map(g=>`<span>${g}</span>`).join('')}</div><p class="gearh">Ingredients</p><div class="check">`+s.items.map(([n,q,note,ev],i)=>`<label><input type="checkbox" data-ck="${i}" ${checked[i]?'checked':''}><span class="n">${n}${ev?`<span class="evl">EVIDENCE ${TEAM.roman}</span>`:''}${note?`<small>${note}</small>`:''}</span><span class="q">${q}</span></label>`).join('')+`</div>${mwBlock(s)}`;
  }else{
    curHeat=s.heat||2;
    const hk=s.how||[];
    const how=hk.length?`<button class="how" id="howbtn" data-how aria-expanded="false" aria-controls="howp">How?</button>`:'';
    const howp=hk.length?`<div class="howp" id="howp" hidden>${hk.map(k=>`<div class="term"><div class="mini">${HOW[k].art}</div><div><h3>${HOW[k].t}</h3><p>${HOW[k].d}</p></div></div>`).join('')}</div>`:'';
    h=`${tag}<div class="art">${ART[s.art]}</div><div class="ttl"><h1>${s.title}</h1>${how}</div>${howp}<p class="detail">${s.detail}</p>`;
    if(s.timer){const T=timerFor(s.timer);h+=`<button class="timer" data-timer="${s.timer.id}"><span class="clock">${fmt(tLeft(T))}</span><span class="lbl"></span></button>`}
    if(s.ings)h+=rows('ings',s.ings);
    h+=facts+mwBlock(s)+(s.note?`<p class="note">${s.note}</p>`:'');
  }
  const st=$('stage');st.innerHTML=h;st.scrollTop=0;st.classList.remove('fade');void st.offsetWidth;st.classList.add('fade');
  $('back').disabled=cur===0;$('next').textContent=cur===0?'Start':cur===STEPS.length-1?'Done':'Next';$('next').disabled=cur===STEPS.length-1;
  store.set(SK+'step',cur);paintTimers();
}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();wake()}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return go(+g.dataset.go);
  const hw=e.target.closest('[data-how]');if(hw){const p=$('howp'),open=p.hidden;p.hidden=!open;hw.setAttribute('aria-expanded',open);hw.textContent=open?'Close':'How?';return}
  const t=e.target.closest('[data-timer]');if(t)return toggleTimer(t.dataset.timer);
  const d=e.target.closest('[data-dock]');if(d){const id=d.dataset.dock;if(timers[id].ring)toggleTimer(id);return go(STEPS.findIndex(s=>s.timer?.id===id))}
});
$('clock').onclick=()=>{unlockAudio();wake();
  if(goAt==null){goAt=Date.now();store.set(GO,goAt)}
  else if(confirm('Reset the case clock? Only do this if the host said "Go" again.')){goAt=null;store.del(GO)}
  paintClock()};
document.addEventListener('change',e=>{const c=e.target.closest('[data-ck]');if(c){checked[c.dataset.ck]=c.checked;store.set(SK+'checked',checked)}});
$('next').onclick=()=>go(cur+1);$('back').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let tx=null,ty=null;
$('stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('stage').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));tx=null},{passive:true});
let lock=null;async function wake(){try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
const qs=new URLSearchParams(location.search);if(qs.has('step'))cur=Math.max(0,Math.min(STEPS.length-1,+qs.get('step')||0));
// ?t=0.5 freezes every scene at that point of its loop (for checking frames)
if(qs.has('t')){const st=document.createElement('style');st.textContent=`.sc .a{animation-play-state:paused!important;animation-delay:calc(var(--T) * -${+qs.get('t')||0})!important}`;document.head.appendChild(st)}
render();
if(qs.has('how'))document.querySelector('[data-how]')?.click();

</script>
</body>
</html>
